<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>父亲的回忆录</title>


<style>

/* ==============================
   基础
   ============================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #f7f5f0;

    color: #292929;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    -webkit-font-smoothing: antialiased;

}


/* ==============================
   页面
   ============================== */

.container {

    width: 100%;

    max-width: 820px;

    margin: 0 auto;

    padding: 45px 28px 80px;

}


/* ==============================
   封面
   ============================== */

.cover {

    width: 100%;

    height: 320px;

    background: #e8e4dc;

    margin-bottom: 55px;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    font-size: 14px;

    letter-spacing: 2px;

}

.cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* ==============================
   网站标题
   ============================== */

header {

    text-align: center;

    margin-bottom: 55px;

}

.site-title {

    font-size: 38px;

    font-weight: 500;

    letter-spacing: 5px;

    line-height: 1.5;

}

.subtitle {

    margin-top: 12px;

    color: #999;

    font-size: 14px;

    letter-spacing: 2px;

}


/* ==============================
   简介
   ============================== */

.intro {

    font-size: 17px;

    line-height: 2.05;

    color: #555;

    margin-bottom: 55px;

}

.intro p {

    margin: 0 0 16px;

    text-indent: 2em;

}


/* ==============================
   文章列表
   ============================== */

.section-title {

    font-size: 12px;

    color: #999;

    letter-spacing: 3px;

    margin-bottom: 18px;

}

.article-list {

    border-top: 1px solid #ddd9d1;

}

.article-link {

    display: block;

    padding: 27px 8px;

    border-bottom: 1px solid #ddd9d1;

    color: #292929;

    text-decoration: none;

    cursor: pointer;

}

.article-link:hover {

    background: #eeeae2;

}

.article-title {

    font-size: 21px;

    line-height: 1.6;

    margin-bottom: 7px;

}

.article-description {

    color: #999;

    font-size: 13px;

}


/* ==============================
   正文
   ============================== */

.article-page {

    display: none;

}

.article-page.active {

    display: block;

}


/* 返回 */

.back {

    display: inline-block;

    margin-bottom: 45px;

    color: #888;

    font-size: 13px;

    text-decoration: none;

}

.back:hover {

    color: #333;

}


/* 正文标题 */

.article-page h1 {

    text-align: center;

    font-size: 32px;

    font-weight: 500;

    line-height: 1.5;

    letter-spacing: 2px;

    margin:

        0 0 15px;

}

.article-meta {

    text-align: center;

    color: #999;

    font-size: 13px;

    margin-bottom: 55px;

}


/* ==============================
   正文自动缩进
   ============================== */

.article-content {

    font-size: 18px;

    line-height: 2.05;

    letter-spacing: 0.3px;

}

.article-content p {

    margin:

        0 0 1.25em;

    text-indent: 2em;

}


/* 小标题 */

.article-content h2 {

    font-size: 23px;

    font-weight: 500;

    line-height: 1.5;

    margin:

        2.5em 0 1em;

    text-indent: 0;

}

.article-content h3 {

    font-size: 20px;

    font-weight: 500;

    line-height: 1.5;

    margin:

        2em 0 0.8em;

    text-indent: 0;

}


/* 引用 */

.article-content blockquote {

    margin:

        2em 0;

    padding:

        14px 20px;

    border-left:

        3px solid #aaa;

    background:

        #efede8;

    color: #666;

}


/* 图片 */

.article-content img {

    max-width: 100%;

    height: auto;

    display: block;

    margin:

        35px auto;

}


/* 分割线 */

.article-content hr {

    border: 0;

    border-top:

        1px solid #ddd;

    margin:

        45px 0;

}


/* ==============================
   页脚
   ============================== */

footer {

    text-align: center;

    margin-top: 75px;

    padding-top: 25px;

    border-top:

        1px solid #ddd9d1;

    color: #aaa;

    font-size: 12px;

}


/* ==============================
   手机
   ============================== */

@media (max-width: 600px) {

    .container {

        padding:

            25px 18px 55px;

    }

    .cover {

        height: 220px;

        margin-bottom: 38px;

    }

    .site-title {

        font-size: 29px;

        letter-spacing: 3px;

    }

    .intro {

        font-size: 16px;

        line-height: 2;

    }

    .article-content {

        font-size: 17px;

        line-height: 2;

    }

    .article-page h1 {

        font-size: 27px;

    }

    .article-content p {

        text-indent: 2em;

        margin-bottom: 1.2em;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==============================
     封面图片
     ============================== -->

<div class="cover">

    <!--
    以后你把图片放进 images 文件夹：

    images/cover.jpg

    然后把下面的 src 打开即可。

    现在暂时显示预留位置。
    -->

    <span>封面图片预留位置</span>

</div>


<!-- ==============================
     首页
     ============================== -->

<div id="home">


<header>

    <div class="site-title">
        父亲的回忆录
    </div>

    <div class="subtitle">
        The Memories of My Father
    </div>

</header>


<div class="intro">

    <p>
        这里记录父亲留下的文字与人生回忆。
    </p>

    <p>
        一个普通人的记忆，也是一段属于那个时代的个人记录。
    </p>

    <p>
        文字将持续整理、保存与发布。
    </p>

</div>


<div class="section-title">
    MEMORIES
</div>


<div class="article-list">

    <!-- 第一篇文章 -->

    <a
        class="article-link"
        onclick="openArticle()"
    >

        <div class="article-title">
            刍议“接待用鸡”
        </div>

        <div class="article-description">
            回忆录 · 第一篇
        </div>

    </a>


</div>


</div>


<!-- ==============================
     文章页面
     ============================== -->

<div
    id="articlePage"
    class="article-page"
>


<a
    href="#"
    class="back"
    onclick="backHome()"
>
    ← 返回文章目录
</a>


<h1 id="articleTitle">
    刍议“接待用鸡”
</h1>


<div class="article-meta">
    回忆录 · 第一篇
</div>


<div
    id="articleContent"
    class="article-content"
>

    <div style="
        text-align:center;
        color:#999;
        padding:50px 0;
    ">
        正在加载文章……
    </div>

</div>


</div>


<footer>

    © 2026 · The Memories of My Father

</footer>


</div>


<script>

/* =====================================
   GitHub 信息
   ===================================== */

/*
   你的 GitHub：

   用户名：
   xueyuanhancli

   仓库：
   Arcticless

   文件：
   01.md

   分支：
   main
*/


const markdownURL =
"https://raw.githubusercontent.com/xueyuanhancli/Arcticless/main/01.md";


/* =====================================
   打开文章
   ===================================== */

async function openArticle() {


    document
        .getElementById("home")
        .style.display = "none";


    document
        .getElementById("articlePage")
        .classList.add("active");


    window.scrollTo(0, 0);


    const content =
        document.getElementById(
            "articleContent"
        );


    try {


        const response =
            await fetch(markdownURL);


        if (!response.ok) {

            throw new Error(
                "无法读取 01.md"
            );

        }


        let markdown =
            await response.text();


        /* =============================
           Markdown 转 HTML
           ============================= */


        /*
         * HTML 安全处理
         */

        markdown =
            markdown
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");


        /*
         * 图片
         */

        markdown =
            markdown.replace(
                /!\[([^\]]*)\]\(([^)]+)\)/g,

                '<img src="$2" alt="$1">'
            );


        /*
         * ### 三级标题
         */

        markdown =
            markdown.replace(
                /^### (.*)$/gm,

                "<h3>$1</h3>"
            );


        /*
         * ## 二级标题
         */

        markdown =
            markdown.replace(
                /^## (.*)$/gm,

                "<h2>$1</h2>"
            );


        /*
         * # 一级标题
         */

        markdown =
            markdown.replace(
                /^# (.*)$/gm,

                "<h1>$1</h1>"
            );


        /*
         * 引用
         */

        markdown =
            markdown.replace(
                /^> (.*)$/gm,

                "<blockquote>$1</blockquote>"
            );


        /*
         * 分割线
         */

        markdown =
            markdown.replace(
                /^---$/gm,

                "<hr>"
            );


        /*
         * 粗体
         */

        markdown =
            markdown.replace(
                /\*\*(.*?)\*\*/g,

                "<strong>$1</strong>"
            );


        /*
         * 按空行分割段落
         */

        const blocks =
            markdown.split(
                /\n\s*\n/
            );


        let html = "";


        blocks.forEach(
            function(block) {


                block =
                    block.trim();


                if (!block) {

                    return;

                }


                /*
                 * 如果已经是标题、引用、
                 * 图片、分割线，就直接使用。
                 */

                if (

                    block.startsWith("<h1>") ||

                    block.startsWith("<h2>") ||

                    block.startsWith("<h3>") ||

                    block.startsWith("<blockquote>") ||

                    block.startsWith("<hr>") ||

                    block.startsWith("<img")

                ) {


                    html += block;


                }

                else {


                    html +=

                        "<p>" +

                        block.replace(
                            /\n/g,
                            "<br>"
                        ) +

                        "</p>";

                }

            }
        );


        /*
         * 显示文章
         */

        content.innerHTML =
            html;


        /*
         * 如果 Markdown 第一行有 # 标题，
         * 不在正文里重复显示。
         */

        const firstHeading =
            content.querySelector(
                "h1"
            );


        if (firstHeading) {

            document
                .getElementById(
                    "articleTitle"
                )
                .textContent =
                firstHeading.textContent;

            firstHeading.remove();

        }


    }


    catch (error) {


        content.innerHTML =

            '<div style="' +

            'padding:20px;' +

            'background:#eee9e2;' +

            'color:#8a5a5a;' +

            'line-height:1.8;">' +

            '文章读取失败。<br><br>' +

            error.message +

            '<br><br>' +

            '请确认 01.md 已经保存到 ' +

            'Arcticless 仓库的根目录。' +

            '</div>';

    }

}


/* =====================================
   返回首页
   ===================================== */

function backHome() {


    document
        .getElementById("articlePage")
        .classList.remove("active");


    document
        .getElementById("home")
        .style.display = "block";


    window.scrollTo(0, 0);

}

</script>


</body>

</html>
