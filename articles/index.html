<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>父亲的回忆录</title>


  <style>

    /* =====================================
       基础设置
       ===================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      background: #f7f5f0;

      color: #292929;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

      -webkit-font-smoothing: antialiased;

      text-rendering: optimizeLegibility;

    }


    /* =====================================
       页面容器
       ===================================== */

    .container {

      width: 100%;

      max-width: 820px;

      margin: 0 auto;

      padding: 50px 30px 80px;

    }


    /* =====================================
       顶部封面图片
       ===================================== */

    .cover {

      width: 100%;

      height: 320px;

      margin-bottom: 50px;

      background: #e8e4dc;

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #999;

      font-size: 14px;

      letter-spacing: 2px;

    }

    .cover img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* =====================================
       网站标题
       ===================================== */

    header {

      text-align: center;

      margin-bottom: 55px;

    }

    h1 {

      margin: 0 0 14px;

      font-size: 38px;

      font-weight: 500;

      letter-spacing: 4px;

      line-height: 1.4;

    }

    .subtitle {

      color: #888;

      font-size: 15px;

      letter-spacing: 2px;

    }


    /* =====================================
       简介
       ===================================== */

    .intro {

      font-size: 17px;

      line-height: 2.05;

      color: #555;

      margin-bottom: 55px;

    }

    .intro p {

      margin: 0 0 18px;

      text-indent: 2em;

    }


    /* =====================================
       文章区域
       ===================================== */

    .section-title {

      font-size: 12px;

      color: #999;

      letter-spacing: 3px;

      margin-bottom: 18px;

    }


    /* =====================================
       自动生成的文章
       ===================================== */

    .article-content {

      font-size: 18px;

      line-height: 2.05;

      letter-spacing: 0.3px;

      color: #292929;

    }


    /* 第一行标题 */

    .article-content h1 {

      text-align: center;

      font-size: 30px;

      font-weight: 500;

      letter-spacing: 2px;

      margin:

        0 0 15px;

      line-height: 1.5;

    }


    /* 二级标题 */

    .article-content h2 {

      font-size: 23px;

      font-weight: 500;

      line-height: 1.5;

      margin:

        2.5em 0 1em;

      text-indent: 0;

    }


    /* 三级标题 */

    .article-content h3 {

      font-size: 20px;

      font-weight: 500;

      line-height: 1.5;

      margin:

        2em 0 0.8em;

      text-indent: 0;

    }


    /* =====================================
       正文段落
       
       这里就是自动缩进的核心
       ===================================== */

    .article-content p {

      margin:

        0 0 1.25em;

      line-height: 2.05;

      text-indent: 2em;

    }


    /* =====================================
       引用
       ===================================== */

    .article-content blockquote {

      margin:

        2em 0;

      padding:

        14px 20px;

      border-left:

        3px solid #aaa;

      background:

        #efede8;

      color: #666;

      text-indent: 0;

    }


    /* =====================================
       粗体
       ===================================== */

    .article-content strong {

      font-weight: 600;

    }


    /* =====================================
       分割线
       ===================================== */

    .article-content hr {

      border: 0;

      border-top:

        1px solid #ddd;

      margin:

        45px 0;

    }


    /* =====================================
       图片
       ===================================== */

    .article-content img {

      max-width: 100%;

      height: auto;

      display: block;

      margin:

        35px auto;

    }


    /* =====================================
       加载提示
       ===================================== */

    .loading {

      text-align: center;

      color: #999;

      padding: 50px 0;

      font-size: 14px;

    }


    /* =====================================
       错误提示
       ===================================== */

    .error {

      padding: 20px;

      background: #eee9e2;

      color: #8a5a5a;

      line-height: 1.8;

    }


    /* =====================================
       页脚
       ===================================== */

    footer {

      text-align: center;

      margin-top: 75px;

      padding-top: 25px;

      border-top:

        1px solid #ddd9d1;

      color: #aaa;

      font-size: 12px;

      letter-spacing: 1px;

    }


    /* =====================================
       手机 / iPhone
       
       不改变文章结构，
       只是根据屏幕自动调整大小
       ===================================== */

    @media (max-width: 600px) {

      .container {

        padding:

          25px 18px 55px;

      }


      .cover {

        height: 220px;

        margin-bottom: 38px;

      }


      header {

        margin-bottom: 40px;

      }


      h1 {

        font-size: 29px;

        letter-spacing: 3px;

      }


      .subtitle {

        font-size: 12px;

      }


      .intro {

        font-size: 16px;

        line-height: 2;

        margin-bottom: 45px;

      }


      .article-content {

        font-size: 17px;

        line-height: 2;

      }


      .article-content h1 {

        font-size: 26px;

      }


      .article-content h2 {

        font-size: 21px;

      }


      .article-content h3 {

        font-size: 18px;

      }


      .article-content p {

        line-height: 2;

        text-indent: 2em;

        margin-bottom: 1.2em;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =====================================
         封面图片

         以后把图片放在：

         images/cover.jpg

         就会自动显示。

         现在没有图片也没关系，
         会显示“封面图片预留位置”。
         ===================================== -->

    <div class="cover">

      <img
        src="images/cover.jpg"
        alt="父亲的回忆录"
        onerror="
          this.style.display='none';
          this.parentElement.innerHTML='封面图片预留位置';
        "
      >

    </div>


    <!-- =====================================
         网站名称
         ===================================== -->

    <header>

      <h1>
        父亲的回忆录
      </h1>

      <div class="subtitle">
        The Memories of My Father
      </div>

    </header>


    <!-- =====================================
         网站简介
         ===================================== -->

    <section class="intro">

      <p>
        这里记录父亲留下的文字与人生回忆。
      </p>

      <p>
        一个普通人的记忆，也是一段属于那个时代的个人记录。
      </p>

      <p>
        文字将持续整理、保存与发布。
      </p>

    </section>


    <!-- =====================================
         文章
         
         JavaScript 会自动读取：

         01.md

         并把它转换成网页。
         ===================================== -->

    <div class="section-title">
      MEMORIES
    </div>


    <article
      id="article"
      class="article-content"
    >

      <div class="loading">
        正在加载文章……
      </div>

    </article>


    <!-- =====================================
         页脚
         ===================================== -->

    <footer>

      © 2026 · The Memories of My Father

    </footer>


  </div>


  <script>

    /* =====================================
       读取 01.md
       ===================================== */

    async function loadMarkdown() {

      const article =
        document.getElementById("article");


      try {

        const response =
          await fetch("01.md");


        if (!response.ok) {

          throw new Error(
            "没有找到 01.md 文件"
          );

        }


        let markdown =
          await response.text();


        /* ================================
           处理 Markdown
           ================================ */


        /*
         * HTML 安全处理
         */

        markdown =
          markdown
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");


        /*
         * 图片
         */

        markdown =
          markdown.replace(
            /!\[([^\]]*)\]\(([^)]+)\)/g,

            '<img src="$2" alt="$1">'
          );


        /*
         * 一级标题
         */

        markdown =
          markdown.replace(
            /^# (.*)$/gm,

            "<h1>$1</h1>"
          );


        /*
         * 二级标题
         */

        markdown =
          markdown.replace(
            /^## (.*)$/gm,

            "<h2>$1</h2>"
          );


        /*
         * 三级标题
         */

        markdown =
          markdown.replace(
            /^### (.*)$/gm,

            "<h3>$1</h3>"
          );


        /*
         * 引用
         */

        markdown =
          markdown.replace(
            /^> (.*)$/gm,

            "<blockquote>$1</blockquote>"
          );


        /*
         * 分割线
         */

        markdown =
          markdown.replace(
            /^---$/gm,

            "<hr>"
          );


        /*
         * 粗体
         */

        markdown =
          markdown.replace(
            /\*\*(.*?)\*\*/g,

            "<strong>$1</strong>"
          );


        /*
         * 斜体
         */

        markdown =
          markdown.replace(
            /\*(.*?)\*/g,

            "<em>$1</em>"
          );


        /*
         * 按空行分割段落
         */

        const blocks =
          markdown.split(
            /\n\s*\n/
          );


        let html = "";


        blocks.forEach(
          function(block) {

            block =
              block.trim();


            if (!block) {

              return;

            }


            /*
             * 已经是 HTML 元素
             */

            if (

              block.startsWith("<h1>") ||

              block.startsWith("<h2>") ||

              block.startsWith("<h3>") ||

              block.startsWith("<blockquote>") ||

              block.startsWith("<hr>") ||

              block.startsWith("<img")

            ) {

              html += block;


            }

            else {

              /*
               * 普通文字自动成为段落
               */

              html +=
                "<p>" +
                block.replace(
                  /\n/g,
                  "<br>"
                ) +
                "</p>";

            }

          }
        );


        /*
         * 显示文章
         */

        article.innerHTML =
          html;


      }

      catch (error) {

        article.innerHTML =

          '<div class="error">' +

          '文章暂时无法加载。<br><br>' +

          error.message +

          '<br><br>' +

          '请确认 01.md 与 index.html 在同一个目录。' +

          '</div>';

      }

    }


    /*
     * 启动
     */

    loadMarkdown();

  </script>


</body>

</html>
