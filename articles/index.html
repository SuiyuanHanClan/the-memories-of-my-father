<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>父亲的回忆录</title>

  <style>

    /* =========================
       基础设置
       ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7f5f0;
      color: #292929;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* =========================
       页面主体
       ========================= */

    .container {

      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      padding:
        55px 30px 80px;

    }


    /* =========================
       顶部封面图片
       ========================= */

    .cover {

      width: 100%;

      height: 330px;

      margin-bottom: 55px;

      overflow: hidden;

      background: #e8e4dc;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #aaa;

      font-size: 14px;

      letter-spacing: 2px;

    }

    .cover img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

    }


    /* =========================
       标题
       ========================= */

    header {

      text-align: center;

      margin-bottom: 55px;

    }

    h1 {

      margin: 0 0 15px;

      font-size: 38px;

      font-weight: 500;

      letter-spacing: 4px;

      line-height: 1.4;

    }

    .subtitle {

      color: #888;

      font-size: 15px;

      letter-spacing: 2px;

    }


    /* =========================
       简介
       ========================= */

    .intro {

      font-size: 17px;

      line-height: 2.05;

      color: #555;

      margin-bottom: 60px;

    }

    .intro p {

      margin: 0 0 18px;

      text-indent: 2em;

    }


    /* =========================
       文章目录
       ========================= */

    .section-title {

      font-size: 13px;

      color: #999;

      letter-spacing: 3px;

      margin-bottom: 18px;

    }

    .article-list {

      border-top: 1px solid #dcd8d0;

    }

    .article {

      display: block;

      padding: 27px 8px;

      border-bottom: 1px solid #dcd8d0;

      text-decoration: none;

      color: #292929;

      transition: background 0.2s ease;

    }

    .article:hover {

      background: #eeeae2;

    }

    .article-title {

      font-size: 21px;

      line-height: 1.6;

      margin-bottom: 8px;

    }

    .article-description {

      font-size: 13px;

      color: #999;

      letter-spacing: 1px;

    }


    /* =========================
       正文排版
       ========================= */

    .article-content {

      font-size: 18px;

      line-height: 2.05;

      letter-spacing: 0.3px;

    }

    .article-content p {

      margin:

        0 0 1.25em;

      text-indent: 2em;

    }

    .article-content h2 {

      font-size: 23px;

      font-weight: 500;

      margin:

        2.5em 0 1em;

      line-height: 1.5;

      text-indent: 0;

    }

    .article-content h3 {

      font-size: 20px;

      font-weight: 500;

      margin:

        2em 0 0.8em;

      text-indent: 0;

    }

    .article-content blockquote {

      margin:

        2em 0;

      padding:

        15px 20px;

      border-left:

        3px solid #aaa;

      background:

        #efede8;

      color: #666;

    }

    .article-content img {

      max-width: 100%;

      height: auto;

      display: block;

      margin:

        35px auto;

    }


    /* =========================
       页脚
       ========================= */

    footer {

      text-align: center;

      margin-top: 75px;

      padding-top: 25px;

      border-top: 1px solid #ddd9d1;

      color: #aaa;

      font-size: 12px;

      letter-spacing: 1px;

    }


    /* =========================
       手机适配
       ========================= */

    @media (max-width: 600px) {

      .container {

        padding:

          28px 18px 55px;

      }

      .cover {

        height: 230px;

        margin-bottom: 38px;

      }

      h1 {

        font-size: 29px;

        letter-spacing: 3px;

      }

      .subtitle {

        font-size: 12px;

      }

      header {

        margin-bottom: 38px;

      }

      .intro {

        font-size: 16px;

        line-height: 2;

        margin-bottom: 45px;

      }

      .article-content {

        font-size: 17px;

        line-height: 2;

      }

      .article-title {

        font-size: 19px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================
         封面图片
         
         以后把你的图片放进 images 文件夹，
         然后把下面的 cover.jpg 改成图片文件名。

         例如：
         images/father.jpg
         ========================= -->

    <div class="cover">

      <img
        src="images/cover.jpg"
        alt="父亲的回忆录封面"
        onerror="this.style.display='none'; this.parentElement.innerHTML='封面图片预留位置';"
      >

    </div>


    <!-- =========================
         网站标题
         ========================= -->

    <header>

      <h1>
        父亲的回忆录
      </h1>

      <div class="subtitle">
        The Memories of My Father
      </div>

    </header>


    <!-- =========================
         网站简介
         ========================= -->

    <section class="intro">

      <p>
        这里记录父亲留下的文字与人生回忆。
      </p>

      <p>
        一个普通人的记忆，也是一段属于那个时代的个人记录。
      </p>

      <p>
        文字将持续整理、保存与发布。
      </p>

    </section>


    <!-- =========================
         文章目录
         ========================= -->

    <div class="section-title">
      ARTICLES
    </div>


    <div class="article-list">


      <a
        class="article"
        href="articles/01.html"
      >

        <div class="article-title">
          刍议“接待用鸡”
        </div>

        <div class="article-description">
          回忆录 · 第一篇
        </div>

      </a>


      <!--
      以后增加第二篇：

      <a class="article" href="articles/02.html">

        <div class="article-title">
          第二篇文章标题
        </div>

        <div class="article-description">
          回忆录 · 第二篇
        </div>

      </a>
      -->


    </div>


    <!-- =========================
         页脚
         ========================= -->

    <footer>

      © 2026 · The Memories of My Father

    </footer>


  </div>


</body>

</html>

  </div>

</body>
</html>
