<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>父亲的回忆录</title>


<style>

/* =====================================================
   基础
   ===================================================== */

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
}

body {

    margin: 0;
    padding: 0;

    background: #f7f5f0;

    color: #292929;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;

}


/* =====================================================
   页面容器

   电脑和手机使用同一个容器逻辑
   ===================================================== */

.container {

    width: 100%;

    max-width: 780px;

    margin-left: auto;
    margin-right: auto;

    padding-top: 45px;
    padding-bottom: 70px;

    padding-left: 25px;
    padding-right: 25px;

}


/* =====================================================
   封面

   现在没有图片，所以显示预留区域。
   ===================================================== */

.cover {

    width: 100%;

    height: 300px;

    margin-bottom: 50px;

    background: #e8e4dc;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #999;

    font-size: 14px;

    letter-spacing: 2px;

    overflow: hidden;

}

.cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =====================================================
   网站标题
   ===================================================== */

.site-header {

    text-align: center;

    margin-bottom: 55px;

}

.site-title {

    margin: 0;

    font-size: 38px;

    font-weight: 500;

    line-height: 1.5;

    letter-spacing: 5px;

}

.site-subtitle {

    margin-top: 12px;

    font-size: 14px;

    color: #999;

    letter-spacing: 2px;

}


/* =====================================================
   简介
   ===================================================== */

.introduction {

    margin-bottom: 60px;

    color: #555;

    font-size: 17px;

    line-height: 2;

}

.introduction p {

}


/* =====================================================
   文章目录
   ===================================================== */

    margin-bottom: 15px;

    font-size: 12px;

    color: #999;

    letter-spacing: 3px;

}

.article-list {

    border-top: 1px solid #dcd8d0;

}

.article-link {

    display: block;

    width: 100%;

    padding: 25px 8px;

    border-bottom: 1px solid #dcd8d0;

    color: #292929;

    text-decoration: none;

    cursor: pointer;

}

.article-link:hover {

    background: #eeeae2;

}

.article-link-title {

    font-size: 21px;

    line-height: 1.6;

    margin-bottom: 7px;

.article-link-meta {

    color: #999;

/* =====================================================
   首页 / 文章页切换
   ===================================================== */

#home {

    display: block;

}

#articlePage {

    display: none;

}


/* =====================================================
   返回按钮
   ===================================================== */

.back-button {

    display: inline-block;

    margin-bottom: 40px;

    color: #888;

    font-size: 13px;

    text-decoration: none;

}

.back-button:hover {

    color: #333;

}


/* =====================================================
   文章标题
   ===================================================== */

.article-title {

    margin: 0;

    text-align: center;

    font-size: 32px;

    font-weight: 500;

    line-height: 1.5;

    letter-spacing: 2px;

}

.article-meta {

    margin-top: 14px;

    margin-bottom: 55px;

    text-align: center;

    color: #999;

    font-size: 13px;

}


/* =====================================================
   文章正文

   这里是最重要的地方
   ===================================================== */

.article-content {

    width: 100%;

    font-size: 18px;

    line-height: 2.05;

    letter-spacing: 0.3px;

    color: #292929;

    overflow-wrap: break-word;

    word-break: normal;

}


/* 普通段落 */

.article-content p {

    display: block;

    width: 100%;

    margin: 0 0 1.25em 0;

    margin-bottom: 1.25em;

    padding: 0;
    
/* 中文文章首行空两格 */
    text-indent: 2em ！important;

    line-height: 2.05;

}


/* 标题不缩进 */

.article-content h2 {

    display: block;

    margin-top: 2.5em;

    margin-bottom: 1em;

    font-size: 23px;

    font-weight: 500;

    line-height: 1.5;

    text-indent: 0;

}

.article-content h3 {

    display: block;

    margin-top: 2em;

    margin-bottom: 0.8em;

    font-size: 20px;

    font-weight: 500;

    line-height: 1.5;

    text-indent: 0;

}


/* 引用 */

.article-content blockquote {

    display: block;

    margin-top: 2em;

    margin-bottom: 2em;

    padding: 14px 20px;

    border-left: 3px solid #aaa;

    background: #efede8;

    color: #666;

    line-height: 1.9;

    text-indent: 0;

}


/* 图片 */

.article-content img {

    display: block;

    max-width: 100%;

    height: auto;

    margin: 35px auto;

}


/* 分割线 */

.article-content hr {

    border: 0;

    border-top: 1px solid #ddd;

    margin: 45px 0;

}


/* 粗体 */

.article-content strong {

    font-weight: 600;

}


/* =====================================================
   加载
   ===================================================== */

.loading {

    padding: 50px 0;

    text-align: center;

    color: #999;

    font-size: 14px;

}


/* =====================================================
   错误
   ===================================================== */

.error-box {

    padding: 20px;

    background: #eee9e2;

    color: #8a5a5a;

    font-size: 14px;

    line-height: 1.8;

}


/* =====================================================
   页脚
   ===================================================== */

footer {

    margin-top: 70px;

    padding-top: 25px;

    border-top: 1px solid #ddd9d1;

    text-align: center;

    color: #aaa;

    font-size: 12px;

}


/* =====================================================
   手机

   注意：
   只是缩小尺寸，不改变文章结构。
   ===================================================== */

@media screen and (max-width: 600px) {

    .container {

        padding-top: 25px;
        padding-bottom: 55px;

        padding-left: 18px;
        padding-right: 18px;

    }


    .cover {

        height: 220px;

        margin-bottom: 38px;

    }


    .site-title {

        font-size: 29px;

        letter-spacing: 3px;

    }


    .site-subtitle {

        font-size: 12px;

    }


    .site-header {

        margin-bottom: 40px;

    }


    .introduction {

        font-size: 16px;

        line-height: 2;

        margin-bottom: 45px;

    }


    .article-link-title {

        font-size: 19px;

    }


    .article-title {

        font-size: 27px;

    }


    .article-meta {

        margin-bottom: 40px;

    }


    .article-content {

        font-size: 17px;

        line-height: 2;

    }


    .article-content p {

        line-height: 2;

        text-indent: 2em !important;

        margin-bottom: 1.2em;

    }


    .article-content h2 {

        font-size: 21px;

    }


    .article-content h3 {

        font-size: 18px;

    }

}

<body>


<div class="container">

    <!--

       images/cover.jpg

    -->

    <span>
        封面图片预留位置
    </span>

</div>


<!-- =====================================================

     ===================================================== -->

<div id="home">


<header class="site-header">

    <h1 class="site-title">
        父亲的回忆录
    </h1>

    <div class="site-subtitle">

    </div>

</header>


<!-- 简介 -->

<section class="introduction">

    <p>
        这里记录父亲留下的文字与人生回忆。
    </p>

    <p>
        一个普通人的记忆，也是一段属于那个时代的个人记录。
    </p>

    <p>

<div class="section-label">

        </div>

        <div class="article-link-meta">

        </div>

    </a>


</div>


</div>


<!-- =====================================================

     ===================================================== -->

<div id="articlePage">


<a
    href="#"
    class="back-button"
    onclick="showHome(); return false;"
>
    ← 返回文章目录
</a>


<h1
    id="articleTitle"
    class="article-title"
>
    刍议“接待用鸡”
</h1>


<div class="article-meta">
    回忆录 · 第一篇
</div>

    id="articleContent"
    class="article-content"
>

    <div class="loading">

    </div>

</div>

<!-- =====================================================
     页脚
     ===================================================== -->

<footer>

    © 2026 · The Memories of My Father

</footer>


</div>


<script>

/* =========================================================
   你的文章文件

   01.md 和 index.html 在同一个目录。

   使用 GitHub Raw 地址读取。

   ========================================================= */

const ARTICLE_URL =
      "https://suiyuanhanclan.github.io/the-memories-of-my-father/01.md"

/* =========================================================
   显示文章
   ========================================================= */

async function showArticle() {


    const home =
        document.getElementById("home");

    const articlePage =
        document.getElementById("articlePage");

    const content =
        document.getElementById("articleContent");


    /* 首页隐藏 */

    home.style.display = "none";


    /* 文章显示 */

    articlePage.style.display = "block";


    /* 回到顶部 */

    window.scrollTo(0, 0);


    /* 加载提示 */

    content.innerHTML =
        '<div class="loading">正在读取文章……</div>';


    try {


        /*
         * 加时间参数，
         * 避免电脑浏览器读取旧缓存。
         */

        const url =
            ARTICLE_URL +
            "?v=" +
            Date.now();


        const response =
            await fetch(url, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "无法读取 01.md。"
            );

        }


        let markdown =
            await response.text();


        /*
         * 统一不同电脑系统的换行格式
         */

        markdown =
            markdown.replace(
                /\r\n/g,
                "\n"
            );

        markdown =
            markdown.replace(
                /\r/g,
                "\n"
            );


        /*
         * 去掉文件开头和结尾多余空白
         */

        markdown =
            markdown.trim();


        /*
         * 开始转换
         */

        const html =
            markdownToHTML(markdown);


        content.innerHTML =
            html;


        /*
         * 自动读取 Markdown 的第一个 # 标题
         */

        const firstHeading =
            content.querySelector("h1");


        if (firstHeading) {

            document
                .getElementById("articleTitle")
                .textContent =
                firstHeading.textContent;

            firstHeading.remove();

        }


    }

    catch (error) {


        content.innerHTML =

            '<div class="error-box">' +

            '文章读取失败。<br><br>' +

            error.message +

            '<br><br>' +

            '请确认 01.md 位于 Arcticless 根目录，' +

            '并且已经 Commit changes。' +

            '</div>';

    }

}


/* =========================================================
   Markdown → HTML

   重新写的稳定版本
   ========================================================= */

function markdownToHTML(markdown) {


    /*
     * 先保护特殊字符
     */

    let text =
        escapeHTML(markdown);


    /*
     * 图片
     */

    text =
        text.replace(
            /!\[([^\]]*)\]\(([^)]+)\)/g,

            function(match, alt, src) {

                return (
                    '<img src="' +
                    src +
                    '" alt="' +
                    alt +
                    '">'
                );

            }
        );


    /*
     * 粗体
     */

    text =
        text.replace(
            /\*\*(.*?)\*\*/g,

            "<strong>$1</strong>"
        );


    /*
     * 一级标题
     */

    text =
        text.replace(
            /^# (.+)$/gm,

            "<h1>$1</h1>"
        );


    /*
     * 二级标题
     */

    text =
        text.replace(
            /^## (.+)$/gm,

            "<h2>$1</h2>"
        );


    /*
     * 三级标题
     */

    text =
        text.replace(
            /^### (.+)$/gm,

            "<h3>$1</h3>"
        );


    /*
     * 分割线
     */

    text =
        text.replace(
            /^\s*---\s*$/gm,

            "<hr>"
        );


    /*
     * 引用
     */

    text =
        text.replace(
            /^> (.+)$/gm,

            "<blockquote>$1</blockquote>"
        );


    /*
     * 最关键：
     *
     * 按“空行”判断段落。
     *
     * 一个自然段 = 一个 p
     */

    const blocks =
        text.split(
            /\n[ \t]*\n/
        );


    let result = "";


    blocks.forEach(
        function(block) {


            block =
                block.trim();


            if (!block) {

                return;

            }


            /*
             * 已经是 HTML 标签的内容
             */

            if (

                block.startsWith("<h1>") ||

                block.startsWith("<h2>") ||

                block.startsWith("<h3>") ||

                block.startsWith("<blockquote>") ||

                block.startsWith("<hr>") ||

                block.startsWith("<img")

            ) {

                result +=
                    block;


                return;

            }


            /*
             * 普通文字：
             *
             * 换行转换成 <br>
             *
             * 整段包进 <p>
             */

            block =
                block.replace(
                    /\n/g,
                    "<br>"
                );


            result +=
                "<p>" +
                block +
                "</p>";

        }
    );


    return result;

}


/* =========================================================
   HTML 安全处理
   ========================================================= */

function escapeHTML(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   返回首页
   ========================================================= */

function showHome() {


    document
        .getElementById("articlePage")
        .style.display = "none";


    document
        .getElementById("home")
        .style.display = "block";


    window.scrollTo(0, 0);

}

</script>
